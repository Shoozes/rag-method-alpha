name: Atlas hardening candidate
on:
  push:
    branches: [work/atlas-hardening-20261013]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-hardening
  cancel-in-progress: true
jobs:
  qualify:
    if: github.ref == 'refs/heads/work/atlas-hardening-20261013'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Stage bounded source migration
        run: |
          if [ -f .github/atlas-followup.py ]; then
            python .github/atlas-followup.py
            git rm .github/atlas-followup.py
          fi
          for project in modules/browser-rag-ts source/frontend; do
            npm --prefix "$project" install --save-dev --save-exact vite@7.3.7 --ignore-scripts
            npm --prefix "$project" update source-map-js nanoid --ignore-scripts
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'Prepare Atlas replay, browser proof, dependency, and infographic follow-up'
            git push origin HEAD:work/atlas-hardening-20261013
          fi
      - name: Capture audit receipts
        run: |
          mkdir -p .artifacts/followup
          npm --prefix modules/browser-rag-ts audit --json > .artifacts/followup/browser-audit.json
          npm --prefix source/frontend audit --json > .artifacts/followup/frontend-audit.json
      - name: Prepare explicit browser
        working-directory: modules/browser-rag-ts
        run: npx --no-install playwright install --with-deps chromium
      - name: Method and unit checks
        run: |
          node run.mjs test-method
          node run.mjs test-browser-unit
          npm --prefix source/frontend run typecheck
          npm --prefix source/frontend run build
      - name: Full browser and three-way acceptance
        env:
          LOCAL_BROWSER_SOFTWARE_WEBGL: '1'
        run: python -B scripts/browser_rag_smoke.py
      - name: Build and verify public presentation
        if: '!cancelled()'
        env:
          LOCAL_BROWSER_SOFTWARE_WEBGL: '1'
        run: |
          node run.mjs build-browser
          node scripts/atlas_presentation.mjs --update-media
      - name: Retain successful candidate media
        if: success()
        run: |
          git add docs/media modules/browser-rag-ts/demo/media
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh follow-up media from the qualified Atlas candidate'
            git push origin HEAD:work/atlas-hardening-20261013
          fi
      - name: Retain evidence and source
        if: always()
        run: |
          mkdir -p .artifacts/followup
          git rev-parse HEAD > .artifacts/followup/source-commit.txt
          git archive HEAD | gzip > .artifacts/followup/source.tar.gz
          cp -R .artifacts/proof .artifacts/followup/ || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: atlas-hardening-proof
          path: .artifacts/followup
          retention-days: 7
