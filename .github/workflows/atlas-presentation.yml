name: Atlas presentation proof

on:
  push:
    branches: [work/atlas-presentation-20261013]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-presentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Retain exact public source
        run: |
          mkdir -p .artifacts/atlas-proof
          git rev-parse HEAD > .artifacts/atlas-proof/source-commit.txt
          git archive --format=tar HEAD | gzip > .artifacts/atlas-proof/source.tar.gz
      - name: Install pinned browser dependencies
        run: npm --prefix modules/browser-rag-ts ci --ignore-scripts
      - name: Retain isolated verification dependencies
        run: tar -C modules/browser-rag-ts -czf .artifacts/atlas-proof/browser-dependencies.tar.gz node_modules
      - name: Browser unit checks
        id: checks
        continue-on-error: true
        run: node run.mjs test-browser-unit 2>&1 | tee .artifacts/atlas-proof/unit-checks.log
      - name: Build static browser application
        id: build
        continue-on-error: true
        run: node run.mjs build-browser 2>&1 | tee .artifacts/atlas-proof/build.log
      - name: Retain browser artifact
        if: always()
        run: |
          if [ -d modules/browser-rag-ts/.artifacts/release/browser-rag-ts ]; then
            tar -C modules/browser-rag-ts/.artifacts/release -czf .artifacts/atlas-proof/browser-application.tar.gz browser-rag-ts
          fi
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        if: always()
        with:
          name: atlas-presentation-proof
          path: .artifacts/atlas-proof
          retention-days: 3
      - name: Require passing checks and build
        if: always()
        env:
          CHECKS_OUTCOME: ${{ steps.checks.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: test "$CHECKS_OUTCOME" = success && test "$BUILD_OUTCOME" = success
