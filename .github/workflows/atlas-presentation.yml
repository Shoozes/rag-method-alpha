name: Atlas presentation proof

on:
  push:
    branches: [main, work/atlas-presentation-20261013]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-presentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned browser dependencies
        run: npm --prefix modules/browser-rag-ts ci --ignore-scripts
      - name: Prepare explicit CI browser
        working-directory: modules/browser-rag-ts
        run: npx --no-install playwright install --with-deps chromium
      - name: Frozen method conformance
        run: node run.mjs test-method
      - name: Browser unit checks
        run: node run.mjs test-browser-unit
      - name: Build static browser application
        run: node run.mjs build-browser
      - name: Capture and verify the shipped Atlas
        env:
          LOCAL_BROWSER_SOFTWARE_WEBGL: '1'
        run: node scripts/atlas_presentation.mjs
      - name: Retain exact source and visual proof
        if: always()
        run: |
          mkdir -p .artifacts/atlas-proof
          git rev-parse HEAD > .artifacts/atlas-proof/source-commit.txt
          git archive --format=tar HEAD | gzip > .artifacts/atlas-proof/source.tar.gz
          if [ -d .artifacts/proof/atlas-presentation ]; then
            cp -R .artifacts/proof/atlas-presentation .artifacts/atlas-proof/
          fi
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        if: always()
        with:
          name: atlas-presentation-proof
          path: .artifacts/atlas-proof
          retention-days: 7
